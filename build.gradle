plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

def targetMinecraft = providers.gradleProperty('targetMinecraft').getOrElse('1.21.1')
def targets = [
        '1.21.1': [neoForge: '21.1.267', neoForgeRange: '[21.1,21.2)', loaderRange: '[4,)', java: 21],
        '26.3'  : [neoForge: '26.3.0.115', neoForgeRange: '[26.3.0,26.3.1)', loaderRange: '[12,)', java: 25]
]
def target = targets[targetMinecraft]
if (target == null) {
    throw new GradleException("Unsupported Minecraft version: ${targetMinecraft}. Choose from ${targets.keySet()}.")
}

version = "${targetMinecraft}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(target.java)

neoForge {
    version = target.neoForge

    if (targetMinecraft == '1.21.1') {
        parchment {
            minecraftVersion = targetMinecraft
            mappingsVersion = parchment_mappings_version
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version_range: "[${targetMinecraft}]",
            neo_version_range      : target.neoForgeRange,
            loader_version_range   : target.loaderRange,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    inputs.property 'mixinJavaVersion', target.java
    filesMatching('notimeout.mixins.json') {
        expand java_version: target.java
    }
    if (targetMinecraft == '26.3') {
        exclude 'pack.mcmeta'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
